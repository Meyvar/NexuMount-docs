<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>夸克网盘获取accessToken</title>
    <link rel="stylesheet" href="../../../layui/css/layui.css">
</head>
<body>
<form class="layui-form">
    <div class="layui-form-item">
        <button type="button" class="layui-btn" action="getCode" style="width: 100%;">获取accessToken</button>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">accessToken</label>
        <div class="layui-input-block">
            <textarea name="accessToken" disabled class="layui-textarea"></textarea>
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">refreshToken</label>
        <div class="layui-input-block">
            <textarea name="refreshToken" disabled class="layui-textarea"></textarea>
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">appId</label>
        <div class="layui-input-block">
            <textarea name="appId" disabled class="layui-textarea"></textarea>
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">signKey</label>
        <div class="layui-input-block">
            <textarea name="signKey" disabled class="layui-textarea"></textarea>
        </div>
    </div>
</form>



<script src="../../../lib/jquery-3.7.1.min.js"></script>
<script src="../../../layui/layui.js"></script>
<script src="index.js"></script>
</body>
</html>
